aid: jelly
name: Jelly
description: >-
  Jelly (getjelly.co.uk) is an all-in-one costing and kitchen-management
  platform for the hospitality industry - restaurants and professional
  kitchens. It handles supplier invoice processing, ingredient and recipe
  costing, gross-profit (GP) analysis, menu and dish management, suppliers,
  products, purchase orders and stock. Jelly runs a GraphQL API at
  api.getjelly.co.uk (bearer-authenticated, public introspection, 232 queries
  and 168 mutations) behind its kitchen web app, and publishes a first-party
  UI component library (Jelly UI, @getjelly/jelly-ui). Surfaced originally as a
  Seedcamp portfolio company and enriched here from its live public surface.
