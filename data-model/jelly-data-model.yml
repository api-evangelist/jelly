notes: >-
  Many-to-many links are modelled through explicit join types
  (KitchenToSupplier, KitchenToUser, RecipeToIngredient, RecipeToRecipe,
  RecipeToAllergen, MenuToDish). Third-party accounting integration (Xero) is
  exposed through Acc* types (AccInvoice, AccStatus: connected).
